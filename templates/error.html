<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} — Print Recovery MVP</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #f4f7fa; color: #18212b; }
    main { max-width: 560px; padding: 32px; background: white; border: 1px solid #dce3ea; border-radius: 12px; box-shadow: 0 2px 12px #13223812; }
    h1 { margin-top: 0; font-size: 2rem; } .status { color: #9a3d2b; font-weight: 800; }
    code { background: #eef2f6; padding: 3px 6px; border-radius: 4px; } a { color: #145da0; }
  </style>
</head>
<body>
  <main>
    <p class="status">Error {{ status }}</p>
    <h1>{{ message }}</h1>
    <p>If you contact support, provide this correlation ID:</p>
    <p><code>{{ correlation_id }}</code></p>
    <p><a href="/">Return to the dashboard</a></p>
  </main>
</body>
</html>
